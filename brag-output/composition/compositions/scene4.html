<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 900;
        src: local('Plus Jakarta Sans'), local('Inter'), local('Segoe UI'), local('Arial');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 800;
        src: local('JetBrains Mono'), local('Consolas'), local('Courier New');
      }

      :root {
        --bg-obsidian: #010320;
        --text-white: #ffffff;
        --text-slate: #cbd5e1;
        --accent-blue: #0066ff;
        --accent-cyan: #0defd1;
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font-sans);
        color: var(--text-white);
      }

      #scene4 {
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
        position: relative;
      }

      .badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        border-radius: 9999px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid rgba(0, 102, 255, 0.4);
        background: rgba(15, 23, 42, 0.9);
        color: #93c5fd;
        margin-bottom: 20px;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 36px;
        border-radius: 9999px;
        background: #0066ff;
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        box-shadow: 0 10px 30px rgba(0, 102, 255, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <div
      id="scene4"
      data-composition-id="scene4"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <!-- 3D Crypto Coins Layer -->
      <div id="s4-coins" style="position: absolute; inset: 0; pointer-events: none; z-index: 1;">
        <img
          id="coin-usdc"
          src="../assets/images/nexaris/usdc.png"
          alt="USDC"
          style="position: absolute; left: 240px; top: 220px; width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 15px 30px rgba(0, 102, 255, 0.4));"
        />
        <img
          id="coin-btc"
          src="../assets/images/nexaris/btc.png"
          alt="BTC"
          style="position: absolute; right: 260px; top: 180px; width: 160px; height: 160px; object-fit: contain; filter: drop-shadow(0 15px 30px rgba(247, 147, 26, 0.3));"
        />
        <img
          id="coin-eth"
          src="../assets/images/nexaris/eth.png"
          alt="ETH"
          style="position: absolute; right: 380px; bottom: 180px; width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 15px 30px rgba(98, 126, 234, 0.3));"
        />
      </div>

      <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <!-- Logo & Name -->
        <div id="s4-logo-group" style="display: flex; align-items: center; gap: 18px; margin-bottom: 24px;">
          <img
            src="../assets/images/escapement-logo-blue.png"
            alt="Escapement Logo"
            style="height: 52px; width: auto; object-fit: contain;"
          />
          <span style="font-size: 44px; font-weight: 800; letter-spacing: -0.04em; color: #ffffff;">
            Escapement
          </span>
        </div>

        <div class="badge-pill" data-layout-ignore>
          <span>The Deterministic Enforcement Layer</span>
        </div>

        <h2 id="s4-title" style="font-size: 68px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; max-width: 1100px; margin-bottom: 18px;">
          Never let an LLM hold your corporate treasury.
        </h2>

        <p id="s4-tagline" style="font-size: 24px; color: var(--text-slate); font-weight: 500; max-width: 800px; line-height: 1.5; margin-bottom: 38px;">
          Deterministic financial policy interception for autonomous AI commerce.
        </p>

        <!-- CTA Pill -->
        <div id="s4-cta">
          <div class="cta-button">
            <span>Join the Private Alpha → escapement.ai</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s4-coins", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.1);
      tl.fromTo("#s4-logo-group", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 0.3);
      tl.fromTo("#s4-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7);
      tl.fromTo("#s4-tagline", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
      tl.fromTo("#s4-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.6);

      // Finite levitation loop for 6-second window
      tl.to("#coin-usdc", { y: -16, duration: 1.8, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.to("#coin-btc", { y: -20, duration: 2.2, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0);
      tl.to("#coin-eth", { y: -14, duration: 1.9, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
