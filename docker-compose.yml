version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: defai_sentinel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: defai_sentinel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: defai_sentinel_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - ENVIRONMENT=sandbox
      - DATABASE_URL=mysql+pymysql://root:rootpassword@mysql:3306/defai_sentinel
      - PAYMENT_MODE=sandbox
      - ALLOW_LIVE_PAYMENTS=False
      - HOST=0.0.0.0
      - PORT=5001
    depends_on:
      - mysql

volumes:
  mysql_data:
